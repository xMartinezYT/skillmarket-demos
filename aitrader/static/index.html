<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MESA · trading autónomo</title>
<style>
  /* ───────── estética WAYNE: negro, ámbar, acero ───────── */
  :root{
    --bg:#0a0a0b; --bg2:#101012; --bg3:#16161a;
    --line:#232329; --line2:#2e2e36;
    --ink:#e8e6e0; --dim:#6b6b74; --mut:#43434c;
    --am:#ffd230; --am2:#b8940a;
    --ok:#7ddb8a; --rd:#ff5d5d; --vi:#b9a7ff;
    --mono:'SF Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,sans-serif;padding-bottom:40px}
  ::selection{background:var(--am);color:#000}

  header{position:sticky;top:0;z-index:9;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .dot{width:5px;height:5px;background:var(--am);box-shadow:0 0 8px var(--am);animation:bp 2.2s infinite}
  @keyframes bp{50%{opacity:.35}}
  h1{font:700 12px var(--mono);letter-spacing:.34em}
  .tag{font:10px var(--mono);letter-spacing:.18em;color:var(--dim)}
  .modo{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pill{font:10px var(--mono);letter-spacing:.14em;padding:5px 12px;border:1px solid var(--line2);cursor:pointer;
    background:var(--bg2);color:var(--dim);transition:.15s}
  .pill.on{border-color:var(--am);color:var(--am);background:rgba(255,210,48,.07)}
  .pill.rojo.on{border-color:var(--rd);color:var(--rd);background:rgba(255,93,93,.07)}

  main{max-width:1100px;margin:0 auto;padding:18px 20px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .kpi{border:1px solid var(--line);background:var(--bg2);padding:12px 14px}
  .kpi b{display:block;font:600 20px var(--mono);margin-top:3px}
  .kpi span{font:9px var(--mono);letter-spacing:.2em;color:var(--dim)}
  .kpi .sub{font:10px var(--mono);color:var(--mut);margin-top:2px}

  h2{font:700 10px var(--mono);letter-spacing:.26em;color:var(--am);margin:22px 0 10px;display:flex;gap:8px;align-items:center}
  h2::before{content:"";width:4px;height:4px;background:var(--am)}

  table{width:100%;border-collapse:collapse}
  th{font:9px var(--mono);letter-spacing:.16em;color:var(--mut);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);font:12px var(--mono)}
  tr:hover td{background:var(--bg2)}
  .verde{color:var(--ok)} .rojo{color:var(--rd)} .ambar{color:var(--am)} .gris{color:var(--dim)}
  .accion{color:#000;background:var(--am);border:0;font:700 10px var(--mono);letter-spacing:.1em;
    padding:6px 12px;cursor:pointer}
  .accion:hover{background:#ffe27a}
  .accion.venta{background:transparent;color:var(--rd);border:1px solid var(--rd)}
  .chip{font:9px var(--mono);padding:2px 7px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.1em}
  .chip.copy{border-color:var(--vi);color:var(--vi)}
  .chip.buy{border-color:var(--ok);color:var(--ok)}
  .chip.fail{border-color:var(--rd);color:var(--rd)}
  .vacio{padding:26px;text-align:center;color:var(--mut);font:11px var(--mono);letter-spacing:.14em}
  .aviso{border-left:2px solid var(--am);background:rgba(255,210,48,.05);padding:10px 14px;
    font:11px var(--mono);color:var(--dim);margin-bottom:14px;line-height:1.7}
  .err{border-left-color:var(--rd);background:rgba(255,93,93,.05)}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  #reloj{font:10px var(--mono);color:var(--mut);letter-spacing:.12em}
  .barra{height:3px;background:var(--bg3);position:relative;margin-top:6px}
  .barra i{position:absolute;inset:0;right:auto;background:var(--am)}
</style>
</head>
<body>

<header>
  <span class="dot"></span>
  <h1>MESA</h1>
  <span class="tag">TRADING AUTÓNOMO · GMGN</span>
  <span id="reloj"></span>
  <div class="modo">
    <button class="pill" id="bShadow" onclick="setModo('SHADOW')">SHADOW</button>
    <button class="pill rojo" id="bLive" onclick="setModo('LIVE')">LIVE</button>
  </div>
</header>

<main>
  <div id="avisos"></div>

  <div class="kpis">
    <div class="kpi"><span>CUENTA</span><b id="kSaldo">—</b><div class="sub" id="kPico"></div></div>
    <div class="kpi"><span>CAÍDA DESDE PICO</span><b id="kDD">—</b>
      <div class="barra"><i id="kDDbar" style="width:0%"></i></div>
      <div class="sub" id="kCorte"></div></div>
    <div class="kpi"><span>POSICIONES</span><b id="kPos">—</b><div class="sub" id="kExpo"></div></div>
    <div class="kpi"><span>MOTOR</span><b id="kMotor" class="ambar">—</b><div class="sub" id="kCopy"></div></div>
  </div>

  <h2>POSICIONES ABIERTAS</h2>
  <div id="posiciones"><div class="vacio">CARGANDO…</div></div>

  <h2>LO QUE HA HECHO EL BOT</h2>
  <div id="ops"><div class="vacio">CARGANDO…</div></div>

  <h2>CANDIDATAS DEL SCANNER <span class="tag" id="tChain"></span></h2>
  <div class="tabs">
    <button class="pill on" id="tabSol" onclick="setChain('sol')">SOLANA</button>
    <button class="pill" id="tabRh" onclick="setChain('robinhood')">ROBINHOOD</button>
  </div>
  <div id="tabla"><div class="vacio">CARGANDO…</div></div>
</main>

<script>
/* MESA — UI propia sobre el backend local (app.py).
   Regla nº1: NUNCA mentir. Todo dato pintado sale de /api/*; si algo no
   llega, se muestra el hueco y el motivo, no un número inventado.  */
let chain = "sol";
let ocupado = false;

const $ = (id) => document.getElementById(id);
const money = (v) => v == null ? "—" : "$" + Number(v).toFixed(0);
const hora = (ts) => (ts || "").slice(11, 19);

function aviso(txt, esError) {
  $("avisos").innerHTML =
    `<div class="aviso ${esError ? "err" : ""}">${txt}</div>`;
}

async function jget(u) { const r = await fetch(u); return r.json(); }
async function jpost(u, b) {
  const r = await fetch(u, { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(b || {}) });
  if (!r.ok) throw new Error((await r.json()).detail || r.status);
  return r.json();
}

/* ── cabecera: modo + kpis ── */
async function pintaEstado() {
  /* /api/status NO trae posiciones (verificado): van en /api/positions. */
  const [s, ps] = await Promise.all([jget("/api/status"), jget("/api/positions_light")]);
  const pos = ps.positions || [];
  $("bShadow").classList.toggle("on", s.mode === "SHADOW");
  $("bLive").classList.toggle("on", s.mode === "LIVE");
  $("kMotor").textContent = s.mode === "LIVE" ? "OPERANDO" : "MIRANDO";
  $("kMotor").className = s.mode === "LIVE" ? "verde" : "ambar";
  $("kPos").textContent = pos.length + "/4";
  const expo = pos.reduce((a, p) => a + (p.size_sol || 0), 0);
  $("kExpo").textContent = "exposición " + expo.toFixed(2) + " SOL";
  pintaPosiciones(pos);
  return s;
}

async function pintaResumen() {
  try {
    const r = await jget("/api/resumen");
    $("kSaldo").textContent = money(r.saldo_usd);
    $("kPico").textContent = "pico " + money(r.pico_usd);
    const dd = r.drawdown == null ? null : r.drawdown * 100;
    $("kDD").textContent = dd == null ? "sin lectura" : dd.toFixed(1) + "%";
    $("kDD").className = dd != null && dd > 30 ? "rojo" : dd != null && dd > 15 ? "ambar" : "verde";
    $("kDDbar").style.width = Math.min(100, (dd || 0) * 2) + "%";
    $("kCorte").textContent = "corta en " + money(r.corte_usd);
    $("kCopy").textContent = (r.copytrade ? "copytrading ON" : "copytrading OFF")
      + " · ronda " + Math.round((r.auto_cada || 0) / 60) + "min";
  } catch (e) { $("kSaldo").textContent = "—"; }
}

/* ── posiciones ── */
function pintaPosiciones(pos) {
  if (!pos.length) {
    $("posiciones").innerHTML =
      '<div class="vacio">SIN POSICIONES — el bot compra solo cuando algo pasa sus filtros</div>';
    return;
  }
  $("posiciones").innerHTML = `<table><tr>
      <th>TOKEN</th><th>CADENA</th><th>TAMAÑO</th><th>PNL</th><th></th></tr>` +
    pos.map(p => {
      const pnl = (p.pnl ?? 0) * 100;
      return `<tr>
        <td><a href="https://gmgn.ai/${p.chain || "sol"}/token/${p.address}?ref=P5ulV5oU"
               target="_blank" rel="noopener"
               style="color:var(--am);text-decoration:none;border-bottom:1px dotted var(--am2)">
               <b>${p.symbol || "?"}</b> ↗</a></td>
        <td class="gris">${p.chain || "sol"}</td>
        <td>${p.size_sol}</td>
        <td class="${pnl >= 0 ? "verde" : "rojo"}">${pnl >= 0 ? "+" : ""}${pnl.toFixed(1)}%</td>
        <td><button class="accion venta" onclick="vender('${p.address}')">CERRAR</button></td>
      </tr>`;
    }).join("") + "</table>";
}

/* ── historial del bot ── */
async function pintaOps() {
  try {
    const r = await jget("/api/ops?limit=25");
    const ops = r.ops || [];
    if (!ops.length) {
      $("ops").innerHTML = '<div class="vacio">TODAVÍA NADA HOY</div>'; return;
    }
    $("ops").innerHTML = `<table><tr><th>HORA</th><th>QUÉ</th><th>TOKEN</th><th>DETALLE</th></tr>` +
      ops.map(o => {
        const cls = o.action === "COPY" ? "copy"
          : (o.action === "BUY" || o.action === "AUTO" || o.action === "PIRAMIDE") ? "buy"
          : (o.action === "VENTA_PROPIA" || o.action === "VENTA_EXTERNA" || o.action === "SELL") ? "copy"
          : o.action.includes("FAIL") ? "fail" : "";
        // SISTEMA no lleva color: es info, no una operación
        const nombre = o.action === "COPY" ? "COPY"
          : (o.action === "BUY" || o.action === "AUTO") ? "COMPRA"
          : o.action === "SELL" ? "VENTA"
          : o.action === "VENTA_PROPIA" ? "VENTA·BOT"
          : o.action === "VENTA_EXTERNA" ? "VENTA·TP/SL"
          : o.action === "PIRAMIDE" ? "AMPLIA"
          : o.action.includes("SKIP") ? "PASA"
          : o.action.includes("FAIL") ? "FALLO"
          : o.action === "SYNC" ? "LIMPIEZA"
          : o.action === "SISTEMA" ? "SISTEMA" : o.action;
        return `<tr>
          <td class="gris">${hora(o.ts)}</td>
          <td><span class="chip ${cls}">${nombre}</span></td>
          <td><b>${o.symbol && o.symbol !== "-" ? o.symbol : ""}</b></td>
          <td class="gris" style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
            ${(o.reason || "").slice(0, 110)}</td>
        </tr>`;
      }).join("") + "</table>";
  } catch (e) { /* se reintenta al siguiente tick */ }
}

/* ── scanner ── */
async function pintaScanner() {
  if (ocupado) return;
  ocupado = true;
  try {
    const r = await jpost("/api/run", { chain });
    const dec = (r.decisions || [])
      .filter(d => d.decision && d.decision.action === "ACTION")
      .sort((a, b) => (b.decision.priority || 0) - (a.decision.priority || 0));
    $("tChain").textContent = "· " + (r.decisions || []).length + " analizadas";
    if (!dec.length) {
      $("tabla").innerHTML =
        '<div class="vacio">NINGUNA CANDIDATA AHORA — o el mercado está frío o GMGN está limitando</div>';
      return;
    }
    $("tabla").innerHTML = `<table><tr>
        <th>PRIO</th><th>TOKEN</th><th>RAZÓN</th><th></th></tr>` +
      dec.slice(0, 12).map(d => {
        const c = d.decision;
        return `<tr>
          <td class="ambar">${c.priority ?? ""}</td>
          <td><a href="https://gmgn.ai/${chain}/token/${c.address}?ref=P5ulV5oU"
                 target="_blank" rel="noopener"
                 style="color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--line2)">
                 <b>${c.symbol || c.address.slice(0, 8)}</b> ↗</a></td>
          <td class="gris" style="max-width:430px">${(c.reason || "").slice(0, 90)}</td>
          <td><button class="accion" onclick="comprar('${c.address}',${c.size_sol})">COMPRAR ${c.size_sol}</button></td>
        </tr>`;
      }).join("") + "</table>";
  } catch (e) {
    aviso("Scanner: " + e.message, true);
  } finally { ocupado = false; }
}

/* ── acciones ── */
async function setModo(m) {
  try {
    await jpost("/api/mode", { mode: m });
    aviso(m === "LIVE"
      ? "LIVE: el bot compra y vende SOLO. Corte automático al −50%."
      : "SHADOW: el bot mira pero no toca nada.");
    pintaEstado();
  } catch (e) { aviso("No se pudo cambiar el modo: " + e.message, true); }
}
function setChain(c) {
  chain = c;
  $("tabSol").classList.toggle("on", c === "sol");
  $("tabRh").classList.toggle("on", c === "robinhood");
  $("tabla").innerHTML = '<div class="vacio">CARGANDO…</div>';
  pintaScanner();
}
async function comprar(addr, size) {
  if (!confirm("¿Comprar " + size + " (" + chain + ")?")) return;
  try {
    await jpost("/api/buy", { address: addr, size_sol: size, chain });
    aviso("Orden enviada. Sale en LO QUE HA HECHO EL BOT en unos segundos.");
    setTimeout(() => { pintaOps(); pintaEstado(); }, 2500);
  } catch (e) { aviso("Compra rechazada: " + e.message, true); }
}
async function vender(addr) {
  if (!confirm("¿Cerrar la posición entera?")) return;
  try {
    await jpost("/api/sell", { address: addr });
    aviso("Venta enviada.");
    setTimeout(() => { pintaOps(); pintaEstado(); }, 2500);
  } catch (e) { aviso("Venta rechazada: " + e.message, true); }
}

/* ── bucle ──
   estado/ops son baratos (leen local): cada 20s.
   scanner llama a /api/run (caché backend 300s): cada 60s. */
/* Javi (01/09): "pon algo que vaya refrescando solo, si no recargo hay
   cosas que no salen". Tres capas:
   1. intervalos normales (estado/ops 15s, resumen/scanner 60s)
   2. al VOLVER a la pestaña se refresca TODO al instante — el navegador
      congela los timers de pestañas en segundo plano y por eso "faltaban
      cosas" al volver
   3. cada refresco pinta "ACTUALIZADO HH:MM:SS" para que se VEA vivo */
let ultimaAct = null;
function tick() {
  const ahora = new Date().toTimeString().slice(0, 8);
  $("reloj").textContent = ultimaAct
    ? ahora + " · actualizado " + ultimaAct : ahora;
}
function refrescaTodo() {
  pintaEstado(); pintaResumen(); pintaOps(); pintaScanner();
  ultimaAct = new Date().toTimeString().slice(0, 8);
}
function refrescaRapido() {
  pintaEstado(); pintaOps();
  ultimaAct = new Date().toTimeString().slice(0, 8);
}
setInterval(tick, 1000); tick();
refrescaTodo();
setInterval(refrescaRapido, 10000);
setInterval(() => { pintaResumen(); pintaScanner();
  ultimaAct = new Date().toTimeString().slice(0, 8); }, 60000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refrescaTodo();
});
window.addEventListener("focus", refrescaTodo);
</script>
</body>
</html>
